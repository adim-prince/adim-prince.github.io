textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px;resize:vertical}.btn:disabled{opacity:.6;cursor:wait}

.clo>.rlob{margin:12px 16px}.clo>div:last-child{padding:0 16px 14px}
.rlob{border:1px solid var(--line);border-left:3px solid var(--soft2);background:var(--card);border-radius:6px;padding:10px 12px}
.rlo-h input.nm{font-size:15px;font-weight:600;color:var(--ink)}
.rlob .rlo{margin-left:6px;padding:4px 0 4px 12px;border-left:2px solid var(--soft2);font-size:13px}
.rlob .rlo input{font-size:13px;padding:4px 8px}.rlob .rlo .bar{height:5px}.rlob .rlo .x{font-size:12px}

.help{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}.help .card{max-width:440px;margin:0}.help td{padding:4px 12px 4px 0;font-size:13.5px;vertical-align:top}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);background:var(--tint);border-radius:4px;padding:1px 6px;white-space:nowrap}
.chip{white-space:normal;flex:0 0 auto;min-width:72px;max-width:150px;text-align:left;line-height:1.25;overflow-wrap:anywhere}
.chip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#app{display:block}main{margin:0 auto}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px clamp(16px,4vw,44px);background:var(--tint);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}

.rlo.a3{grid-template-columns:1fr repeat(3,76px) 1fr auto}

input[type=range]{accent-color:var(--accent);padding:0}.wt{width:68px;padding:3px 6px}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px}main:focus{outline:none}
.btn,.chip,nav button,.cc,.x,input,select{transition:background-color .15s,border-color .15s,color .15s,transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){box-shadow:0 2px 8px rgba(20,85,58,.28)}.btn:active,.chip:active,nav button:active{transform:scale(.97)}
.cc:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,85,58,.2)}.cc:focus-within{border-color:var(--accent)}.chip:hover{border-color:var(--accent);transform:translateY(-1px)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}}
.intro .card{animation:rise .4s ease-out both}.intro .cards .card:nth-child(n+2){animation-delay:.07s}.intro .cards .card:nth-child(n+3){animation-delay:.14s}.intro .cards .card:nth-child(n+4){animation-delay:.21s}

</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY='lo-grades-v1';
let S={courses:[],sel:null,page:'courses'},armed=null,focusEl=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.sel=null;S.page='courses';if(!S.set)S.set={letters:[['A',90],['B',80],['C',70],['D',60]],pass:50,dec:1};
const uid=()=>Math.random().toString(36).slice(2,9);
let REF=null,CT,SYNC='Your data is saved in this browser only. Use Save backup file to keep a copy, and Restore from backup to move it to another device.';
const save=()=>{fixA();snap();S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudPush()};
S.courses.forEach(c=>c.clos.forEach(l=>l.rlos.forEach(r=>{if(!r.entries){r.entries=r.score==null?[]:[{id:uid(),name:'Assignment 1',score:r.score}];delete r.score}})));
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
if(!S.cfg)S.cfg={A:{w:1,t:null},B:{w:1,t:70},C:{w:1,t:null},'B+':{w:1,t:50}};
const TYPES=['A','B','C','B+'];
const wt=l=>l.type&&S.cfg[l.type]?S.cfg[l.type].w:1;
const wavg=a=>{a=a.filter(x=>x[0]!=null&&x[1]>0);const s=a.reduce((t,x)=>t+x[1],0);return s?a.reduce((t,x)=>t+x[0]*x[1],0)/s:null};
const th=l=>l.type&&S.cfg[l.type]?S.cfg[l.type].t:null;
const tag=l=>{if(!l.type)return '';const t=th(l),g=cloG(l);if(t==null)return `<span class="pill">Type ${l.type} · no pass threshold</span>`;const st=g==null?'no score yet':g>=t?'Passed':'Not yet passed';return `<span class="pill ${g==null?'':g>=t?'good':'bad'}">Type ${l.type} · pass at ${t}% · ${st}</span>`};
const cfgCard=()=>`<div class="card"><h2>CLO pass thresholds</h2><p class="sub">Each CLO type can have a pass threshold. A CLO passes when its grade reaches it. Types with no threshold are not checked.</p><div class="cfg"><b>Type</b><b>Pass threshold %</b>${TYPES.map(t=>`<span>Type ${t}</span><input data-f="cfgt" data-t="${t}" value="${S.cfg[t].t==null?'':S.cfg[t].t}" inputmode="decimal" placeholder="none" aria-label="Pass threshold for type ${t}">`).join('')}</div></div>`;
const cba=a=>{let o=0,s=false;for(const x of a)if(x!=null){s=true;o=x>=o?x:.6*x+.4*o}return s?o:null};
const pin=(txt,h,k)=>{txt=String(txt).trim().replace(/%$/,'').trim();const m=txt.match(/^(\d+(?:\.\d+)?)\s*(?:\/|of|out of)\s*(\d+(?:\.\d+)?)$/i);h.raw=h.raw||{};if(m&&+m[2]>0){h.raw[k]=txt;return Math.min(100,Math.max(0,m[1]/m[2]*100))}delete h.raw[k];const v=parseFloat(txt);return isNaN(v)?null:Math.min(100,Math.max(0,v))};
const dsp=(h,k,x)=>h.raw&&h.raw[k]!=null?h.raw[k]:(x==null?'':x);
const rlChk=l=>{const ws=l.rlos.map(r=>r.w).filter(x=>x!=null),s=ws.reduce((a,b)=>a+b,0);return ws.length&&Math.abs(s-100)>.01?`<br><b>Check:</b> RLO weights add up to ${s}, not 100. You can fix them after adding.`:''};
const ev=e=>{if(!Array.isArray(e.att))return e.score;const a=e.att.filter(x=>x!=null);if(!a.length)return null;const m=S.set.att||'best';return m==='last'?a[a.length-1]:m==='first'?a[0]:m==='avg'?a.reduce((t,x)=>t+x,0)/a.length:Math.max(...a)};
const rloB=r=>r.m==='cba'?cba(r.entries.map(ev)):avg(r.entries.map(ev));
const rloG=r=>{const b=rloB(r);if(r.top==null)return b;let t=r.top;if(S.set.topc!=null)t=Math.min(t,S.set.topc);const m=S.set.topm||'higher';return b==null?t:m==='replace'?t:m==='avg'?(b+t)/2:Math.max(b,t)};
const fixA=()=>S.courses.forEach(c=>c.clos.forEach(l=>l.rlos.forEach(r=>r.entries.forEach(n=>{if(l.type==='A'&&!Array.isArray(n.att)){n.att=[n.score==null?null:n.score,null,null];delete n.score;if(n.raw&&n.raw.s!=null)n.raw={a0:n.raw.s};else delete n.raw}else if(l.type!=='A'&&Array.isArray(n.att)){n.score=ev(n);delete n.att;delete n.raw}}))));
const ATT=(c,l,r,n)=>[0,1,2].map(i=>`<input type="text" inputmode="text" autocomplete="off" placeholder="Try ${i+1}" data-f="att" data-i="${i}" data-c="${c.id}" data-l="${l.id}" data-r="${r.id}" data-e="${n.id}" value="${esc(dsp(n,'a'+i,n.att[i]))}" aria-label="Attempt ${i+1} score for ${esc(n.name||'entry')}">`).join('');
const topRow=(c,l,r)=>l.type==='B'||l.type==='B+'?`<label class="sub" style="display:flex;gap:8px;align-items:center;margin:6px 0 4px 14px;flex-wrap:wrap">Top Up test score % <input type="text" inputmode="text" autocomplete="off" placeholder="85 or 16/20" style="width:120px" data-f="top" data-c="${c.id}" data-l="${l.id}" data-r="${r.id}" value="${esc(dsp(r,'t',r.top))}" aria-label="Top Up score for ${esc(r.name||'RLO')}">${r.top!=null?`<span class="tag">RLO counts as ${fmt(rloG(r))}</span>`:''}</label>`:'';
const proj=(c,x)=>{const k=JSON.parse(JSON.stringify(c));k.clos.forEach(l=>l.rlos.forEach(r=>r.entries.forEach(n=>{if(ev(n)==null){if(Array.isArray(n.att))n.att[0]=x;else n.score=x}})));return courseG(k)};
const need=(c,t)=>{if(proj(c,0)>=t)return 0;if(proj(c,100)<t)return null;let lo=0,hi=100;for(let i=0;i<20;i++){const m=(lo+hi)/2;proj(c,m)>=t?hi=m:lo=m}return hi};
const blanks=c=>c.clos.filter(l=>!l.pf).reduce((t,l)=>t+l.rlos.reduce((u,r)=>u+r.entries.filter(n=>ev(n)==null).length,0),0);
const wiText=c=>{const g=proj(c,WI);return `Projected course grade: <b>${fmt(g)}</b> (${letter(g)})`};
const whatIf=c=>{const b=blanks(c);if(!c.clos.length)return '';return `<div class="card"><h2>What do I need?</h2>${b?`<p class="sub">${b} entr${b===1?'y has':'ies have'} no score yet. Drag the slider to see your course grade if you score the same on all of them.</p><label class="sub">If I score <b id="wiV">${WI}%</b> on the rest<br><input type="range" min="0" max="100" step="1" value="${WI}" data-f="wi" aria-label="Score on remaining work" style="width:100%;max-width:420px"></label><p id="wiOut" role="status">${wiText(c)}</p><p class="sub"><b>Needed on all remaining work:</b> ${S.set.letters.slice().sort((a,b)=>b[1]-a[1]).map(x=>{const n=need(c,x[1]);return esc(x[0])+' ('+x[1]+'%): '+(n==null?'not reachable':n===0?'secured':'about '+Math.ceil(n)+'%')}).join(' \u00b7 ')}</p>`:'<p class="sub">Every entry has a score, so there is nothing left to project.</p>'}</div>`};
const attCard=()=>`<div class="card"><h2 style="margin-bottom:4px">Type A quiz attempts</h2><p class="sub">Type A quizzes allow up to three attempts. Choose which result counts. Match whatever your instructor says.</p><label class="sub">Counted attempt<br><select data-f="setAtt" aria-label="Which Type A attempt counts">${[['best','Best attempt'],['last','Last attempt entered'],['first','First attempt'],['avg','Average of attempts']].map(o=>`<option value="${o[0]}"${(S.set.att||'best')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label></div><div class="card"><h2 style="margin-bottom:4px">Top Up tests</h2><p class="sub">A Top Up score box appears on RLOs in Type B and B+ CLOs. Choose how it combines with the regular result. These are general rules, so adjust them to match your syllabus.</p><div class="set"><label>How it counts<select data-f="setTop" aria-label="How a Top Up score counts">${[['higher','Counts only if higher'],['replace','Replaces the old result'],['avg','Averaged with the old result']].map(o=>`<option value="${o[0]}"${(S.set.topm||'higher')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label><label>Cap on Top Up score (%)<input data-f="setTopCap" value="${S.set.topc==null?'':S.set.topc}" inputmode="decimal" placeholder="none" aria-label="Cap on Top Up score"></label></div></div>`;
const cloG=c=>c.pf?null:wavg(c.rlos.map(r=>[rloG(r),r.w==null?1:r.w]));
const failing=c=>c.clos.filter(l=>l.pf?l.pass==='fail':th(l)!=null&&cloG(l)!=null&&cloG(l)<th(l));
const courseG=c=>{const g=wavg(c.clos.filter(l=>!l.pf).map(l=>[cloG(l),l.w==null?1:l.w]));return g!=null&&c.cap!=null&&failing(c).length?Math.min(g,c.cap):g};
const letter=g=>g==null?'–':((S.set.letters.slice().sort((a,b)=>b[1]-a[1]).find(x=>g>=x[1])||['F'])[0]);
const fmt=g=>g==null?'—':(+g.toFixed(S.set.dec|0))+'%';
const cls=g=>g==null?'':g>=70?'good':g>=60?'mid':'bad';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bar=(g,th)=>{const k=th!=null&&g!=null?(g>=th?'good':'bad'):cls(g);return `<div class="bar ${k}"><i style="width:${g==null?0:Math.min(100,g)}%"></i>${th!=null?`<u class="mk" style="left:${th}%"></u>`:''}</div>`};

async function readPdf(f){
  IMP.busy=true;IMP.msg='Reading the PDF...';render();
  try{await loadPdfJs();pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+'pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let out='';
    for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent();let y=null;for(const it of tc.items){const ny=it.transform[5];out+=(y!=null&&Math.abs(ny-y)>2?'\n':' ')+it.str;y=ny}out+='\n\n'}
    out=out.replace(/[ \t]+/g,' ').trim();
    if(out.length<200)IMP.msg='No text found in that PDF. It may be a scan. Paste the text instead.';
    else if(new Blob([out]).size>240000)IMP.msg='That PDF has too much text. Paste just the grading sections instead.';
    else{IMP.text=out;IMP.msg='Read '+pdf.numPages+' pages. Click Read syllabus to continue.'}
  }catch(e){IMP.msg='Could not read that PDF. Paste its text instead.'}
  IMP.busy=false;render();
}
const num=v=>typeof v==='number'&&isFinite(v)?v:null,arr=v=>Array.isArray(v)?v:[];
const clean=d=>({name:String(d&&d.name||'New course'),cap:num(d&&d.cap),notes:arr(d&&d.notes).map(String),clos:arr(d&&d.clos).map(l=>({name:String(l.name||'CLO'),type:TYPES.includes(l.type)?l.type:'',w:num(l.w),pf:!!l.pf,rlos:arr(l.rlos).map(r=>({name:String(r.name||'RLO'),w:num(r.w),m:r.m==='cba'?'cba':'avg',entries:arr(r.entries).map(n=>({name:String(n&&n.name||n)}))}))}))});
const PROMPT='Extract the grading scheme from this university course syllabus as JSON only, with no prose and no code fences. Shape: {name: course code and title, clos: [{name: "CLO 1 - title", type: "A" or "B" or "C" or "B+" or "", w: percent of the final course grade or null, pf: true only if the CLO is pass/fail, rlos: [{name: "RLO 1.1 - short text", w: percent weight inside its CLO or null, m: "cba" if the RLO grade keeps the highest result and blends a lower new result with the old one (for example 60:40), otherwise "avg", entries: [{name: each assessment that counts toward the course grade, such as Module 1 Test, Quiz 3 or Lab 1}]}]}], cap: the maximum final grade when pass requirements are not met, or null, notes: [short strings for grading rules you could not model, such as top-up tests, attempts, replacement rules, exemptions or rounding, and any inconsistency you noticed]}. List only assessments that count toward the grade and skip practice work the syllabus says does not count. Use null for anything the syllabus does not state and never guess. Syllabus:\n\n';
function parseSyl(t){
  const dash=' \u2013 ',L=t.split(/\n+/).map(x=>x.replace(/[|\u2022\u00b7]/g,' ').replace(/\s+/g,' ').replace(/^[-*\s]+/,'').trim()).filter(Boolean);
  const WU='(?:%|pts?\\b|points?\\b|marks?\\b)';const pct=x=>{const m=x.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*'+WU,'i'));return m?+m[1]:null};
  const RNG=/\b(?:Pre-?lab\s+)?(?:Quiz(?:zes)?|Labs?|Assignments?)\s*\d+\s*(?:-|\u2013|to)\s*\d+\b/gi;
  const tt=x=>{let i=x.length;[RNG,/\b(?:Module\s*\d+\s*Test|(?:Pre-?lab\s+)?Quiz(?:zes)?\s*#?\d+|Lab\s*\d+|Assignment\s*\d+|Exam\s*#?\d+|Midterm|Final\s+Exam)\b/i,/\b(?:keeps?|highest|best result|assessed|graded|60\s*:\s*40)\b/i].forEach(re=>{const m=new RegExp(re.source,'i').exec(x);if(m&&m.index<i)i=m.index});return x.slice(0,i).replace(/\bType\s+(?:B\+|A|B|C)\b/gi,'').replace(/\(?\s*\d+(?:\.\d+)?\s*(?:%|pts?\b|points?\b|marks?\b)\s*\)?/gi,' ').replace(/pass\s*\/?\s*-?\s*fail/gi,' ').replace(/\s+/g,' ').replace(/^[\s:.\-\u2013\u2014|)(]+|[\s:.\-\u2013\u2014|)(]+$/g,'').slice(0,110)};
  const AS=/\b(?:Module\s*\d+\s*Test|(?:Pre-?lab\s+)?Quiz(?:zes)?\s*#?\d+|Lab\s*\d+|Assignment\s*\d+|Test\s*\d+|Exam\s*\d+|Midterm(?:\s+Exam)?|Final\s+Exam|Project(?:\s*\d+)?|Homework\s*\d+|Report\s*\d+)\b/gi;
  const names=x=>{const o=[];x=x.replace(/\b((?:Pre-?lab\s+)?Quiz(?:zes)?|Labs?|Assignments?)\s*(\d+)\s*(?:-|\u2013|to)\s*(\d+)\b/gi,(m,k,a,b)=>{k=k.replace(/zes$/i,'').replace(/s$/i,'');k=k.replace(/^(\w)/,c=>c.toUpperCase());for(let i=+a;i<=+b&&i-a<15;i++)o.push(k+' '+i);return ' '});
    (x.match(AS)||[]).forEach(m=>{m=m.replace(/#/g,'').replace(/\s+/g,' ').replace(/(\d)(?=[A-Za-z])/,'$1 ').replace(/(Quiz|Lab|Assignment|Test|Homework|Report|Exam)(\d)/i,'$1 $2').replace(/Quizzes/i,'Quiz').replace(/^(\w)/,c=>c.toUpperCase());o.push(m)});return o};
  const C={},add=(n)=>C[n]||(C[n]={n,ti:'',w:null,type:'',pf:false,cba:false,ent:[],r:{}});
  const R=(n,m)=>{const c=add(n);return c.r[m]||(c.r[m]={m,ti:'',w:null,cba:false,ent:[]})};
  const uniq=(a,b)=>{b.forEach(x=>{if(!a.includes(x)&&!/^practice/i.test(x))a.push(x)})};
  for(const x of L){
    let m=x.match(/^(?:course learning outcomes?|learning outcome|clo)[\s\-_]*(\d+)\b\s*[:.\-\u2013\u2014)]*\s*(.*)$/i);
    if(m){const c=add(+m[1]),ti=tt(m[2]);if(!c.ti&&/^[A-Z0-9]/.test(ti)&&ti.length>=3)c.ti=ti}
    m=x.match(/^rlo[\s\-_]*(\d+)\.(\d+)\b\s*[:.\-\u2013\u2014)]*\s*(.*)$/i);
    if(m){const r=R(+m[1],+m[2]),ti=tt(m[3]);if(!r.ti&&/^[A-Z0-9]/.test(ti)&&ti.length>=3)r.ti=ti}
  }
  for(const x of L){
    const cl=[...new Set([...x.matchAll(/\b(?:CLO|Course Learning Outcome|Learning Outcome)[\s\-_]*(\d+)\b/gi)].map(m=>+m[1]))],rl=[...x.matchAll(/\bRLO[\s\-_]*(\d+)\.(\d+)\b/gi)].map(m=>[+m[1],+m[2]]);
    const as=names(x),b=/60\s*:\s*40|highest|best result/i.test(x);
    if(rl.length===1){const r=R(rl[0][0],rl[0][1]);if(r.w==null){const p=pct(x);if(p!=null)r.w=p}if(b)r.cba=true;uniq(r.ent,as)}
    else if(!rl.length&&cl.length===1){const c=add(cl[0]);if(c.w==null){const p=pct(x);if(p!=null)c.w=p}if(!c.type){const m=x.match(/\bType\s+(B\+|A|B|C)\b/i);if(m)c.type=m[1].toUpperCase()}if(/pass\s*\/?\s*-?\s*fail/i.test(x))c.pf=true;if(b)c.cba=true;uniq(c.ent,as)}
  }
  const out={name:'',cap:null,notes:[],clos:[]};
  const nm=L.find(x=>/\b[A-Z]{2,4}\s?\d{3}\b/.test(x));if(nm)out.name=(nm.match(/\b[A-Z]{2,4}\s?\d{3}\b.{0,70}/)[0]).replace(/\s+(?:CLO|RLO|Course Learning).*/i,'').trim();
  for(const x of L){if(/course|final|overall/i.test(x)&&/not (?:met|achieved|passed)|fail|below|requirement|threshold|minimum/i.test(x)){const m=x.match(/(?:max(?:imum)?|cap(?:ped)?|no higher than|not exceed)[^.]{0,80}?(\d{2,3})\s*%/i);if(m&&+m[1]<=100){out.cap=+m[1];break}}}
  const seen=new Set;for(const x of L){if(out.notes.length>=8)break;if(x.length<=220&&/top[ -]?up|attempt|retake|replac|exempt|round|dropped|rubric|does not count|do not count/i.test(x)&&!/^(?:clo|rlo)\s*\d/i.test(x)&&!seen.has(x)){seen.add(x);out.notes.push(x.slice(0,180))}}
  Object.keys(C).map(Number).sort((a,b)=>a-b).forEach(n=>{const c=C[n],rs=Object.keys(c.r).map(Number).sort((a,b)=>a-b).map(i=>c.r[i]);
    out.clos.push({name:'CLO '+n+(c.ti?dash+c.ti:''),type:c.type,w:c.w,pf:c.pf,rlos:c.pf?[]:rs.map(r=>({name:'RLO '+n+'.'+r.m+(r.ti?dash+r.ti:''),w:r.w,m:r.cba||c.cba?'cba':'avg',entries:(r.ent.length?r.ent:c.ent).map(e=>({name:e}))}))})});
  return out}

  IMP.busy=false;render();
}
function applyImp(){const d=IMP.data;if(!d)return;const k={id:uid(),name:d.name,cap:d.cap,notes:d.notes,clos:d.clos.map(l=>({id:uid(),name:l.name,type:l.type,w:l.w,pf:l.pf,pass:'',rlos:l.rlos.map(r=>({id:uid(),name:r.name,w:r.w,m:r.m,entries:r.entries.map(n=>({id:uid(),name:n.name,score:null}))}))}))};S.courses.push(k);S.page='courses';S.sel=k.id;ANIM=true;IMP.data=null;IMP.msg=''}
const pfBox=(c,l)=>`<div class='rlob'><label>Result: <select data-f='pass' data-c='${c.id}' data-l='${l.id}' aria-label='Pass or fail'>${[['','Not yet'],['pass','Pass'],['fail','Fail']].map(o=>`<option value='${o[0]}'${(l.pass||'')===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label></div>`;
const reqCard=c=>{const f=failing(c),n=c.notes||[];if(c.cap==null&&!n.length)return '';return `<div class='card'>${c.cap==null?'':`<h2>Pass requirements</h2><p class='sub'>${f.length?`Not met: ${f.map(l=>esc(l.name.split(' \u2013 ')[0])).join(', ')}. The course grade is capped at ${c.cap}%.`:`Each CLO with a pass threshold must reach it, or the course grade is capped at ${c.cap}%. Nothing is failing right now.`}</p>`}${n.length?`<h2 style='margin-top:12px'>From the syllabus</h2><ul class='sub'>${n.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`};
const impReview=d=>{const tot=d.clos.reduce((s,l)=>s+(l.w||0),0);return `<div class='card'><h2>${esc(d.name)}</h2>${Math.abs(tot-100)>.01?`<p class='sub'><b>Check:</b> CLO weights add up to ${tot}%, not 100%.</p>`:''}${d.clos.map(l=>`<p class='sub'><b>${esc(l.name)}</b> \u00b7 ${l.pf?'pass/fail':`Type ${esc(l.type||'?')} \u00b7 ${l.w==null?'?':l.w}% of course`}<br>${l.rlos.map(r=>`${esc(r.name)} (${r.w==null?'?':r.w}%${r.m==='cba'?', keeps best, else 60:40':''}): ${r.entries.map(n=>esc(n.name)).join(', ')||'no assessments listed'}`).join('<br>')}${rlChk(l)}</p>`).join('')}${d.cap!=null?`<p class='sub'>Missing a pass requirement caps the course grade at ${d.cap}%.</p>`:''}${d.notes.length?`<p class='sub'><b>Also noted:</b></p><ul class='sub'>${d.notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div style='display:flex;gap:10px'><button class='btn' data-act='applyImp'>Add this course</button><button class='btn ghost' data-act='discardImp'>Discard</button></div></div>`};
const importView=()=>`<button class='btn ghost sm' style='margin:0 0 12px' data-act='goPage' data-p='courses'>&larr; Back to courses</button><div class='head'><div><h1>Import a syllabus</h1><p class='sub'>Upload the syllabus PDF or paste its text. The page reads the grading scheme and fills in the course, using Claude when it is available and its own built-in reader when it is not. You review it before anything is added.</p></div></div><div class='card'><label class='sub'>Upload the syllabus PDF, or paste its text below.<br><input type='file' id='pdf' accept='application/pdf,.pdf'></label><textarea id='syl' style='margin-top:10px' rows='9' placeholder='Paste syllabus text here' aria-label='Syllabus text'>${esc(IMP.text)}</textarea><div style='display:flex;gap:10px;flex-wrap:wrap;margin-top:10px'><button class='btn' data-act='readSyl'${IMP.busy?' disabled':''}>${IMP.busy?'Reading...':'Read syllabus'}</button><button class='btn ghost' data-act='readLocal'>Read without Claude</button><button class='btn ghost' data-act='exampleSyl'>Try the GE 122 example</button></div><p class='sub'>${esc(IMP.msg)}</p></div>${IMP.data?impReview(IMP.data):''}`;
const Q=(n,w,m,...e)=>({name:n,w,m,entries:e.map(x=>({name:x}))}),N=(p,k)=>Array.from({length:k},(_,i)=>p+' '+(i+1));
const M1='Module 1 Test',M2='Module 2 Test',LB=['Lab 1','Lab 2','Lab 3'];
const EX={name:'GE 122 \u2013 Engineering Mechanics I',cap:49,notes:['Practice assessments are for learning only and do not count toward the grade.','Type A quizzes allow up to three attempts. The syllabus does not say which attempt counts, so choose it in Settings.','Top Up tests exist for CLOs 1, 2, 4 and 5 and Enter them on each RLO and set how they count in Settings.','The syllabus mentions RLOs 5.1 to 5.5 for the labs but defines only 5.1 to 5.4, at 20% each.','CLO 4 is listed with Practice 1-7 and Module 2 Test in the assessment table, but the text describes Module 1 and Module 2 Tests. Imported as the two Module Tests.','Rubric levels are 100, 90, 70, 50, 30 and 0.'],clos:[
{name:'CLO 0 \u2013 Course Essentials',pf:true,rlos:[]},
{name:'CLO 1 \u2013 Solve Standard Particle Kinematics Problems',type:'B',w:20,rlos:[Q('RLO 1.1 \u2013 1D and 2D rectilinear kinematics',30,'avg',M1),Q('RLO 1.2 \u2013 2D curvilinear kinematics',35,'avg',M1),Q('RLO 1.3 \u2013 Dependent and relative motion',35,'avg',M1)]},
{name:'CLO 2 \u2013 Solve Standard Particle Kinetics Problems',type:'B',w:35,rlos:[Q('RLO 2.1 \u2013 Kinetic equations of motion',35,'avg',M2),Q('RLO 2.2 \u2013 Work, power and energy',35,'avg',M2),Q('RLO 2.3 \u2013 Impulse, momentum and impact',30,'avg',M2)]},
{name:'CLO 3 \u2013 Basic Kinematics and Kinetics Concepts',type:'A',w:5,rlos:[Q('RLO 3.1 \u2013 Terms and simple calculations',80,'avg',...N('Quiz',7)),Q('RLO 3.2 \u2013 Lab measurements and software',20,'avg',...N('Pre-lab Quiz',3))]},
{name:'CLO 4 \u2013 Program Learning Outcomes in Dynamics',type:'B',w:10,rlos:[Q('RLO 4.1 \u2013 Technical accuracy and framing',35,'cba',M1,M2),Q('RLO 4.2 \u2013 Notation',35,'cba',M1,M2),Q('RLO 4.3 \u2013 Format and logical flow',30,'cba',M1,M2)]},
{name:'CLO 5 \u2013 Program Learning Outcomes (Labs)',type:'B+',w:10,rlos:[Q('RLO 5.1 \u2013 Hypotheses',20,'cba',...LB),Q('RLO 5.2 \u2013 Data presentation',20,'cba',...LB),Q('RLO 5.3 \u2013 Error and uncertainty',20,'cba',...LB),Q('RLO 5.4 \u2013 Conclusions',20,'cba',...LB)]},
{name:'CLO 6 \u2013 More Advanced Kinematics and Kinetics',type:'C',w:20,rlos:[Q('RLO 6.1 \u2013 Advanced kinematics',45,'avg',M1),Q('RLO 6.2 \u2013 Advanced kinetics',55,'avg',M2)]}]};

const nS=()=>S.n==null?2:S.n,cur=()=>S.courses.find(x=>x.id===S.sel);
const win=c=>{const L=c.clos.length,n=nS()||L||1,s=Math.min(Math.max(0,S.start||0),Math.max(0,L-n));return[s,Math.min(L,s+n)]};
const vis=c=>{const w=win(c);return c.clos.slice(w[0],w[1])};
function pg(c,d){if(c)S.start=win(c)[0]+d*(nS()||c.clos.length||1)}
const picker=c=>{if(!c.clos.length)return '';const w=win(c);return `<div class="pick"><div class="chips">${c.clos.map((l,i)=>`<button class="chip${i>=w[0]&&i<w[1]?' on':''}" data-act="goClo" data-i="${i}" title="${esc(l.name)}"><span>${esc(l.name.split(' \u2013 ')[0])}</span><small>${fmt(cloG(l))}</small></button>`).join('')}</div><div class="pc"><label>Show <select data-f="showN" aria-label="CLOs shown at once">${[1,2,3,4,0].map(v=>`<option value="${v}"${nS()===v?' selected':''}>${v||'All'}</option>`).join('')}</select> at once</label><button class="btn ghost sm" data-act="pg" data-d="-1">Previous</button><button class="btn ghost sm" data-act="pg" data-d="1">Next</button><span class="sub">CLOs ${w[0]+1}-${w[1]} of ${c.clos.length}</span></div></div>`};
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function toggleTheme(){const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('lo-theme',n)}catch(e){}render()}
try{const t=localStorage.getItem('lo-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let H=[JSON.stringify(S.courses)],HI=0,HT=0,COAL=false,TT,HELP=false;
function snap(){const s=JSON.stringify(S.courses);if(H[HI]===s)return;if(COAL&&Date.now()-HT<900&&HI>0)H[HI]=s;else{H=H.slice(0,HI+1);H.push(s);HI=H.length-1;if(H.length>100){H.shift();HI--}}HT=Date.now();COAL=false}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('show'),3500)}
function restore(){S.courses=JSON.parse(H[HI]);if(S.sel&&!cur())S.sel=null;S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudPush();render()}
const undo=()=>{if(HI>0){HI--;restore();toast('Undone')}else toast('Nothing to undo')};
const redo=()=>{if(HI<H.length-1){HI++;restore();toast('Redone')}else toast('Nothing to redo')};
const KEYS=[['Ctrl/Cmd + Z','Undo'],['Ctrl/Cmd + Shift + Z, or Ctrl + Y','Redo'],['Ctrl/Cmd + A','Select all (inside a field, its text)'],['Enter, Down arrow','Next score (Shift + Enter, Up arrow: previous)'],['[ and ]','Previous / next CLOs'],['1 to 9','Jump to that CLO'],['D','Switch light / dark'],['?','Show or hide this list'],['Esc','Leave a field, or close this list or the open course'],['Ctrl/Cmd + S','Confirm saving (it saves automatically)']];
const helpPanel=()=>HELP?`<div class="help" role="dialog" aria-label="Keyboard shortcuts"><div class="card"><h2 style="margin-bottom:8px">Keyboard shortcuts</h2><table>${KEYS.map(k=>`<tr><td><kbd>${k[0]}</kbd></td><td>${k[1]}</td></tr>`).join('')}</table><div style="margin-top:12px"><button class="btn" data-act="help">Close</button></div></div></div>`:'';
document.addEventListener('keydown',e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName),k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey,nat=t.id==='syl'||t.id==='newCourse';
  if(m&&(k==='z'||k==='y')&&!nat){e.preventDefault();(k==='y'||e.shiftKey)?redo():undo();return}
  if(m&&k==='s'){e.preventDefault();toast('Saved. Changes save automatically.');return}
  if(t.dataset&&(t.dataset.f==='score'||t.dataset.f==='att')&&!m&&['enter','arrowdown','arrowup'].includes(k)){e.preventDefault();const a=[...document.querySelectorAll('[data-f=score],[data-f=att]')],i=a.indexOf(t)+(e.shiftKey||k==='arrowup'?-1:1);if(a[i]){a[i].focus();a[i].select()}return}
  if(k==='escape'){if(HELP){HELP=false;render()}else if(typing)t.blur();else if(S.sel){S.sel=null;render()}return}
  if(typing||m||e.altKey)return;
  if(k==='?'){HELP=!HELP;render()}else if(k==='d')toggleTheme();
  else if(k==='['||k===']'){const c=cur();if(c){pg(c,k===']'?1:-1);render()}}
  else if(/^[1-9]$/.test(k)){const c=cur();if(c&&c.clos[k-1]){S.start=+k-1;render()}}
});

let ANIM=false,ARM=null,FIRST=true,WI=70;
const passPill=g=>g==null?'':`<span class="pill ${g>=S.set.pass?'good':'bad'}">${g>=S.set.pass?'Passing':'Below '+S.set.pass+'%'}</span>`;
const themeSel=()=>document.documentElement.dataset.theme||'system';
function setTheme(v){if(v==='system'){delete document.documentElement.dataset.theme;try{localStorage.removeItem('lo-theme')}catch(e){}}else{document.documentElement.dataset.theme=v;try{localStorage.setItem('lo-theme',v)}catch(e){}}render()}
const topBar=()=>`<header class="top"><h1 class="brand">Learning Outcomes<small>RLO \u2192 CLO \u2192 course grade</small></h1><nav aria-label="Main">${[['courses','Courses'],['settings','Settings']].map(p=>`<button class="${S.page===p[0]||(p[0]==='courses'&&S.page==='import')?'on':''}" data-act="goPage" data-p="${p[0]}">${p[1]}</button>`).join('')}</nav><div class="tools"><button class="btn ghost sm" data-act="undo">Undo</button><button class="btn ghost sm" data-act="redo">Redo</button><button class="btn ghost sm" data-act="theme">${isDark()?'Light':'Dark'} mode</button><button class="btn ghost sm" data-act="help">Shortcuts (?)</button></div></header>`;
const directory=()=>{const all=avg(S.courses.map(courseG)),n=S.courses.length;return `<div class="head"><div><h1>My courses</h1><p class="sub">${n?`${n} course${n>1?'s':''}. Select one to see its CLOs and RLOs.`:'Add your first course to get started.'}</p></div>${n?`<div class="big"><b>${fmt(all)}</b><span>Overall average \u00b7 ${letter(all)}</span></div>`:''}</div>
<div class="card"><h2 style="margin-bottom:8px">Add a course</h2><div class="add"><input id="newCourse" placeholder="Course name, for example GE 122" aria-label="New course name"><button class="btn" data-act="addCourse">Add course</button></div><p class="sub" style="margin:10px 0 0">Have a syllabus? <button class="btn ghost sm" style="margin:0 0 0 6px" data-act="goPage" data-p="import">Import from syllabus</button></p></div>
${n?`<div class="cards">${S.courses.map(c=>{const g=courseG(c);return `<div class="card cc" data-act="open" data-c="${c.id}"><h2><span>${esc(c.name)}</span><span>${fmt(g)} ${letter(g)}</span></h2><p class="sub">${c.clos.length} CLO${c.clos.length===1?'':'s'}</p>${bar(g)}<p style="margin:8px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${passPill(g)}<button class="btn ghost sm" style="margin:0" data-act="open" data-c="${c.id}" aria-label="Open ${esc(c.name)}">Open</button><button class="x" data-act="del" data-k="course" data-c="${c.id}" aria-label="Delete ${esc(c.name)}">${armed==='course,'+c.id+',,,'?'Confirm delete':'Delete'}</button></p></div>`}).join('')}</div>`:'<div class="empty">No courses yet.</div>'}`};
const sheet=c=>`<div class="sheet${ANIM?' anim':''}" role="dialog" aria-modal="true" aria-label="${esc(c.name)}"><div class="sheet-in"><button class="btn ghost sm" style="margin:0 0 14px" data-act="close">&larr; Back to courses</button>${courseView(c)}</div></div>`;
const settingsView=()=>{const s=S.set,L=s.letters;return `<div class="head"><div><h1>Settings</h1><p class="sub">These apply to every course. Changes save automatically.</p></div></div>
<div class="card"><h2 style="margin-bottom:8px">Appearance</h2><label class="sub">Theme<br><select data-f="setTheme" aria-label="Theme">${[['system','Match my device'],['light','Light'],['dark','Dark']].map(o=>`<option value="${o[0]}"${themeSel()===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label></div>
<div class="card"><h2 style="margin-bottom:4px">Grading system</h2><p class="sub">Letter grade cutoffs. A grade gets the highest letter whose minimum it reaches. Anything below the lowest cutoff is F.</p><div class="lt">${L.map((x,i)=>`<input data-f="lt" data-i="${i}" value="${esc(x[0])}" aria-label="Letter ${i+1}"><input data-f="lm" data-i="${i}" value="${x[1]}" inputmode="decimal" aria-label="Minimum percent for ${esc(x[0])}"><button class="x" data-act="delLetter" data-i="${i}" aria-label="Remove ${esc(x[0])}">Remove</button>`).join('')}</div><div style="display:flex;gap:8px;margin:10px 0 16px"><button class="btn ghost sm" style="margin:0" data-act="addLetter">Add grade</button><button class="btn ghost sm" style="margin:0" data-act="resetLetters">Reset to A-F</button></div>
<div class="set"><label>Pass mark (%)<input data-f="setPass" value="${s.pass}" inputmode="decimal"></label><label>Decimals shown<select data-f="setDec">${[0,1,2].map(v=>`<option value="${v}"${s.dec===v?' selected':''}>${v}</option>`).join('')}</select></label><label>CLOs shown at once<select data-f="showN">${[1,2,3,4,0].map(v=>`<option value="${v}"${nS()===v?' selected':''}>${v||'All'}</option>`).join('')}</select></label></div></div>
${attCard()}${cfgCard()}
<div class="card"><h2 style="margin-bottom:4px">Your data</h2><p class="sub">Everything is stored in this browser only. Clearing browser data or switching devices loses it, so save a backup file now and then. Restoring replaces your current courses (Ctrl/Cmd + Z undoes it).</p><p class="sub" id="sync" role="status">${esc(SYNC)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><button class="btn ghost sm" style="margin:0" data-act="exportBk">Save backup file</button><label class="btn ghost sm" style="margin:0">Restore from backup<input type="file" id="bkfile" accept=".json,application/json" hidden></label></div><button class="x" data-act="resetAll">${ARM==='all'?'Click again to erase every course':'Erase all courses'}</button></div>`};
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-act="exportBk"]');if(!b)return;try{const d=await claude.use('downloads');if(!d){toast('Saving files is not available in this view');return}await d.save({filename:'grade-tracker-backup.json',data:JSON.stringify({app:'lo-grades',v:1,courses:S.courses,set:S.set,cfg:S.cfg,n:S.n},null,1)});toast('Backup saved')}catch(err){toast(err&&err.code==='declined'?'Backup cancelled':'Could not save the backup')}});
document.addEventListener('change',async e=>{if(e.target.id!=='bkfile'||!e.target.files[0])return;try{const d=JSON.parse(await e.target.files[0].text());if(d.app!=='lo-grades'||!Array.isArray(d.courses))throw 0;S.courses=d.courses;if(d.set)S.set=d.set;if(d.cfg)S.cfg=d.cfg;if(d.n!=null)S.n=d.n;S.sel=null;save();render();toast('Backup restored')}catch(err){toast('That is not a valid backup file')}});
const updSync=()=>{const el=document.getElementById('sync');if(el)el.textContent=SYNC};
function cloudPush(){clearTimeout(CT);if(!REF)return;CT=setTimeout(async()=>{try{await REF.set({json:JSON.stringify({courses:S.courses,set:S.set,cfg:S.cfg,n:S.n}),ts:S.ts});SYNC='Synced to your account.'}catch(e){SYNC='Could not sync right now. Saved in this browser.'}updSync()},800)}
async function cloudInit(){try{const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;const id=await u.id();if(!id)return;REF=db.collection('data/users/'+id).doc('tracker');const sn=await REF.get(),d=sn.exists?sn.data():null;
  if(d&&d.json&&(d.ts||0)>(S.ts||0)){const q=JSON.parse(d.json);S.courses=q.courses||[];if(q.set)S.set=q.set;if(q.cfg)S.cfg=q.cfg;if(q.n!=null)S.n=q.n;S.ts=d.ts;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}H=[JSON.stringify(S.courses)];HI=0;SYNC='Synced to your account. Your saved courses were loaded.';render();return}
  SYNC='Synced to your account.';if(S.courses.length)cloudPush()}catch(e){SYNC='Account sync is not available here. Your data stays in this browser.'}updSync()}
render();
if(window.claude)cloudInit();
</script></body></html>
